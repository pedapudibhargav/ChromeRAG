# pytest and ruff on every push and pull request (Linux, macOS, Windows × Python 3.11 and 3.13).

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Shared runners are slower than a desktop; timing tests multiply their limits by this factor.
env:
  CHROMERAG_TEST_TIME_SCALE: "4"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, for the freeze-0.1.5 check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install from source, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev,baselines]"
          ruff check .
          pytest -q
