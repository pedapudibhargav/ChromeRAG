# Publish a tagged version to PyPI with trusted publishing (no API token stored anywhere).
# Run by hand: Actions → publish → Run workflow, with the tag to publish (for example v0.1.5).
# PyPI side: project chromerag → Publishing → trusted publisher for this repository,
# workflow "publish.yml", environment "pypi".

name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (for example v0.1.5)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Check that the package version matches the tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${tag}" || { echo "pyproject version ${version} does not match tag ${tag}"; exit 1; }
          ls dist/chromerag-"${version}"-py3-none-any.whl dist/chromerag-"${version}".tar.gz
      - name: Install the wheel and run it
        shell: bash
        run: |
          python -m pip install dist/*.whl
          chromerag --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chromerag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
