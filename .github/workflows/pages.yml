# Test on every push and pull request; on pushes to main, build the one-page site
# (docs/index.html + docs/data/*.json) and publish it to the gh-pages branch.
# GitHub Pages setting: Source = Deploy from a branch → Branch = gh-pages / (root).

name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from source and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: README quick start
        run: |
          chromerag --version
          chromerag extract examples/site/pricing.html -o out/pricing.md
          chromerag learn examples/site -o out/site_chrome.json --min-pages 3
          chromerag batch examples/site -o out/batch --chrome-model out/site_chrome.json

  build-site:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build site (runs tests, writes _site/)
        run: bash scripts/build_docs.sh
      - name: Check site contents
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
          for f in leaderboard corpus_comparison_report retrieval_eval_report stce_summary test_report; do
            test -f "_site/data/$f.json" || { echo "missing _site/data/$f.json"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error

  deploy-gh-pages:
    needs: build-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish site from ${{ github.sha }}"
