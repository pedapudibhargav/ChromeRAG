[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromerag"
version = "0.1.2"
description = "HTML to RAG-ready Markdown: a learned boilerplate filter that removes site chrome (navigation, footers, cookie banners, related links, comments) and keeps article, documentation and pricing content. Pure NumPy inference, no model download."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Bhargava Chary Peddapudi", email = "pedapudibhargav@gmail.com" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "html",
  "html-to-markdown",
  "markdown",
  "boilerplate-removal",
  "content-extraction",
  "main-content-extraction",
  "web-scraping",
  "web-template-detection",
  "llm",
  "chunking",
  "vector-search",
  "trafilatura-alternative",
  "langchain",
  "llamaindex",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "beautifulsoup4>=4.12.0,<5",
  "lxml>=5.0.0,<7",
  "pyyaml>=6.0.0,<7",
  "numpy>=1.26.0,<3",
]

[project.optional-dependencies]
# Fetch stays optional — ChromeRAG core is HTML-in / Markdown-out.
fetch = [
  "httpx>=0.27.0,<0.29",
]
baselines = [
  "markdownify>=0.13.0",
  "readability-lxml>=0.8.1",
  "trafilatura>=1.12.0",
  "markitdown>=0.1.0",
  "html2text>=2024.2.26",
]
langchain = [
  "langchain-core>=0.2",
]
llamaindex = [
  "llama-index-core>=0.10",
]
ui = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.7.0,<3",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "httpx>=0.27.0,<0.29",
]

[project.scripts]
chromerag = "chromerag.cli:main"

[project.urls]
Homepage = "https://github.com/pedapudibhargav/ChromeRAG"
Repository = "https://github.com/pedapudibhargav/ChromeRAG.git"
Issues = "https://github.com/pedapudibhargav/ChromeRAG/issues"
Documentation = "https://pedapudibhargav.github.io/ChromeRAG/"
Changelog = "https://github.com/pedapudibhargav/ChromeRAG/blob/main/CHANGELOG.md"
"Cite" = "https://doi.org/10.5281/zenodo.22970289"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chromerag = ["assets/*.json", "assets/*.txt", "assets/*.npz", "rules/*.yaml"]
