name: rs-trafilatura extraction
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rs-trafilatura==0.1.1
      - name: Fetch WCXB (CC-BY-4.0, upstream)
        run: git clone --depth 1 https://github.com/murroughfoley/wcx.git wcx && ls wcx | head
      - run: python extract_rs.py wcx test out_test
      - uses: actions/upload-artifact@v4
        with:
          name: rs-trafilatura-test-0.1.1
          path: out_test
