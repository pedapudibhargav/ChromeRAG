name: chromerag

services:
  extractor:
    container_name: chromerag
    build:
      context: .
      dockerfile: ${CHROMERAG_DOCKERFILE:-Dockerfile}
    image: chromerag:local
    volumes:
      - ./src:/app/src
      - ./poc:/app/poc
      - ./tests:/app/tests
      - ./examples:/app/examples:ro
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./apps:/app/apps
      - ./docs:/app/docs
      - ./pyproject.toml:/app/pyproject.toml:ro
    environment:
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
    working_dir: /app
    ports:
      - "8765:8765"
    command:
      [
        "python3",
        "-m",
        "uvicorn",
        "apps.ui.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8765",
      ]
    networks:
      - chromerag-net

networks:
  chromerag-net:
    name: chromerag-net
